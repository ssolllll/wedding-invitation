<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <!-- 카카오톡 · 문자 공유 시 미리보기 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:locale" content="ko_KR">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body data-wedding-date="{{ site.wedding.date }}">
  {% if site.effects.falling_petals %}
  <canvas id="petals" class="petals-canvas" aria-hidden="true"
          data-count="{{ site.effects.petals_count | default: 14 }}"
          data-burst="{{ site.effects.petals_burst | default: 24 }}"></canvas>
  {% endif %}
  <main class="invitation">
    {{ content }}
  </main>
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
